<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Capas Exclusivas</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Font Awesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col relative pb-20 select-none">

  <!-- Cabeçalho Principal -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-pink-500 text-white flex items-center justify-center font-bold text-xl shadow-md">
          <i class="fa-solid fa-book-open"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-900 tracking-tight">Catálogo de Capas</h1>
          <p class="text-xs text-slate-500">Agendas & Cadernos Personalizados</p>
        </div>
      </div>
      
      <!-- Busca rápida -->
      <div class="relative w-full sm:w-72">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-sm"></i>
        <input 
          type="text" 
          id="busca-input" 
          placeholder="Buscar modelo..." 
          class="w-full pl-9 pr-4 py-2 bg-slate-100 rounded-full text-sm border-none focus:ring-2 focus:ring-pink-500 outline-none transition-all"
          oninput="filtrarProdutos()"
        />
      </div>
    </div>

    <!-- Navegação por Categorias -->
    <div class="border-t border-slate-100 bg-white">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <nav class="flex space-x-2 py-3 overflow-x-auto hide-scrollbar text-sm" id="categorias-container">
          <!-- Gerado via JavaScript -->
        </nav>
      </div>
    </div>
  </header>

  <!-- Grade de Capas (Catálogo) -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
    <div id="produtos-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Cards renderizados dinamicamente -->
    </div>
    
    <!-- Mensagem de busca sem resultado -->
    <div id="sem-resultados" class="hidden text-center py-16">
      <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
      <p class="text-slate-500 text-base">Nenhum modelo encontrado.</p>
    </div>
  </main>

  <!-- VISUALIZADOR TELA CHEIA FLUIDO (GALERIA/STORIES) -->
  <div id="galeria-modal" class="fixed inset-0 bg-slate-950/95 z-50 flex flex-col justify-between hidden transition-opacity duration-200">
    
    <!-- Topo da Galeria: Título e Botão Fechar -->
    <div class="w-full p-4 flex justify-between items-center text-white z-20 bg-gradient-to-b from-black/80 to-transparent">
      <div>
        <h3 id="galeria-titulo" class="font-semibold text-base sm:text-lg"></h3>
        <p id="galeria-contador" class="text-xs text-white/70"></p>
      </div>
      <button onclick="fecharGaleria()" class="bg-white/10 hover:bg-white/20 text-white w-10 h-10 rounded-full flex items-center justify-center transition-all">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
    </div>

    <!-- Centro da Galeria: Imagem + Botões Laterais Grandes -->
    <div class="relative flex-grow flex items-center justify-center p-2 sm:p-6 overflow-hidden" onclick="fecharGaleria()">
      
      <!-- Imagem Ampliada -->
      <img 
        id="galeria-imagem" 
        src="" 
        class="max-w-full max-h-[70vh] sm:max-h-[75vh] object-contain rounded-lg shadow-2xl transition-all duration-300 cursor-pointer" 
        alt="Foto da capa"
        onclick="event.stopPropagation()"
      />

      <!-- Seta Esquerda (Anterior) -->
      <button 
        id="btn-galeria-ant" 
        onclick="event.stopPropagation(); mudarFotoGaleria(-1)" 
        class="absolute left-2 sm:left-6 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/80 text-white w-12 h-12 rounded-full flex items-center justify-center transition-all border border-white/20 z-30"
      >
        <i class="fa-solid fa-chevron-left text-xl"></i>
      </button>

      <!-- Seta Direita (Próxima) -->
      <button 
        id="btn-galeria-prox" 
        onclick="event.stopPropagation(); mudarFotoGaleria(1)" 
        class="absolute right-2 sm:right-6 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/80 text-white w-12 h-12 rounded-full flex items-center justify-center transition-all border border-white/20 z-30"
      >
        <i class="fa-solid fa-chevron-right text-xl"></i>
      </button>
    </div>

    <!-- Rodapé da Galeria: Miniaturas + Descrição + Botão do WhatsApp -->
    <div class="w-full p-4 bg-gradient-to-t from-black/90 via-black/80 to-transparent flex flex-col items-center gap-3 z-20">
      
      <!-- Miniaturas clicáveis no rodapé -->
      <div id="galeria-miniaturas" class="flex gap-2 overflow-x-auto max-w-full hide-scrollbar py-1">
        <!-- Gerado via JS -->
      </div>

      <p id="galeria-descricao" class="text-xs text-slate-300 text-center max-w-lg line-clamp-2 px-2"></p>

      <!-- Botão de Ação Direta para o WhatsApp -->
      <a 
        id="galeria-btn-whatsapp" 
        href="#" 
        target="_blank" 
        class="bg-emerald-500 hover:bg-emerald-600 text-white font-medium text-sm py-2.5 px-6 rounded-xl flex items-center gap-2 shadow-lg transition-all"
      >
        <i class="fa-brands fa-whatsapp text-lg"></i>
        Quero este modelo
      </a>
    </div>
  </div>

  <!-- Botão Flutuante do WhatsApp na Tela Inicial -->
  <a 
    href="#" 
    target="_blank" 
    id="btn-whatsapp-flutuante"
    class="fixed bottom-6 right-6 z-30 bg-emerald-500 hover:bg-emerald-600 text-white rounded-full p-4 shadow-xl flex items-center justify-center transition-all hover:scale-105 group"
    title="Fale Conosco no WhatsApp"
  >
    <i class="fa-brands fa-whatsapp text-2xl"></i>
    <span class="max-w-0 overflow-hidden whitespace-nowrap group-hover:max-w-xs transition-all duration-300 ease-in-out text-sm font-medium pl-0 group-hover:pl-2">
      Falar no WhatsApp
    </span>
  </a>

  <!-- Rodapé do Site -->
  <footer class="bg-white border-t border-slate-200 mt-auto py-6 text-center text-xs text-slate-500">
    <p>© Catálogo de Capas Personalizadas. Todos os direitos reservados.</p>
  </footer>

  <!-- Lógica da Aplicação -->
  <script>
    const NUMERO_WHATSAPP = "5598988000000"; // Informe seu número real com DDD

    // BASE DE DADOS DOS PRODUTOS
    const produtos = [
      {
        id: 1,
        titulo: "Capa Corrida Transforma - Rosa",
        categoria: "agendas",
        imagens: [
          "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=1000&auto=format&fit=crop",
          "https://images.unsplash.com/photo-1512820790803-83ca734da794?w=1000&auto=format&fit=crop",
          "https://images.unsplash.com/photo-1589829085413-56de8ae18c73?w=1000&auto=format&fit=crop"
        ],
        descricao: "Design exclusivo em tons rosa e branco com laminação durável e acabamento impecável."
      },
      {
        id: 2,
        titulo: "Caderno Personalizado Floral",
        categoria: "cadernos",
        imagens: [
          "https://images.unsplash.com/photo-1531346878377-a5be20888e57?w=1000&auto=format&fit=crop",
          "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=1000&auto=format&fit=crop"
        ],
        descricao: "Estampa floral elegante com acabamento fosco aveludado e espaço para detalhes."
      },
      {
        id: 3,
        titulo: "Capa Minimalista Executiva",
        categoria: "agendas",
        imagens: [
          "https://images.unsplash.com/photo-1589829085413-56de8ae18c73?w=1000&auto=format&fit=crop"
        ],
        descricao: "Visual limpo e sofisticado para planejamento diário e rotina de trabalho."
      }
    ];

    let categoriaAtual = 'todas';
    let produtoAtivo = null;
    let indiceFotoAtual = 0;

    // Suporte para deslizar o dedo (Swipe) no celular
    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener('DOMContentLoaded', () => {
      renderizarCategorias();
      renderizarProdutos();
      atualizarLinkWhatsappFlutuante();
      configurarTeclasETouch();
    });

    function atualizarLinkWhatsappFlutuante() {
      const btn = document.getElementById('btn-whatsapp-flutuante');
      btn.href = `https://wa.me/${NUMERO_WHATSAPP}?text=Olá!%20Gostaria%20de%20saber%20mais%20sobre%20as%20capas.`;
    }

    function renderizarCategorias() {
      const container = document.getElementById('categorias-container');
      const categorias = [
        { id: 'todas', nome: 'Todas as Capas' },
        { id: 'agendas', nome: 'Agendas' },
        { id: 'cadernos', nome: 'Cadernos' }
      ];

      container.innerHTML = categorias.map(cat => `
        <button 
          onclick="filtrarPorCategoria('${cat.id}')"
          class="px-4 py-1.5 rounded-full whitespace-nowrap transition-all text-xs font-medium ${
            categoriaAtual === cat.id 
              ? 'bg-pink-500 text-white shadow-sm' 
              : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
          }"
        >
          ${cat.nome}
        </button>
      `).join('');
    }

    function renderizarProdutos() {
      const grid = document.getElementById('produtos-grid');
      const semResultados = document.getElementById('sem-resultados');
      const termoBusca = document.getElementById('busca-input').value.toLowerCase();

      const filtrados = produtos.filter(p => {
        const bateCategoria = categoriaAtual === 'todas' || p.categoria === categoriaAtual;
        const bateBusca = p.titulo.toLowerCase().includes(termoBusca) || p.descricao.toLowerCase().includes(termoBusca);
        return bateCategoria && bateBusca;
      });

      if (filtrados.length === 0) {
        grid.innerHTML = '';
        semResultados.classList.remove('hidden');
        return;
      }

      semResultados.classList.add('hidden');
      grid.innerHTML = filtrados.map(p => `
        <div class="bg-white rounded-2xl border border-slate-200/80 overflow-hidden shadow-sm hover:shadow-md transition-all flex flex-col group cursor-pointer" onclick="abrirGaleria(${p.id})">
          <div class="relative aspect-square bg-slate-100 overflow-hidden">
            <img src="${p.imagens[0]}" alt="${p.titulo}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy" />
            ${p.imagens.length > 1 ? `
              <span class="absolute top-3 right-3 bg-slate-900/70 backdrop-blur-sm text-white text-[10px] px-2 py-0.5 rounded-full flex items-center gap-1">
                <i class="fa-solid fa-images"></i> ${p.imagens.length}
              </span>
            ` : ''}
          </div>
          <div class="p-4 flex flex-col flex-grow">
            <h3 class="font-semibold text-slate-900 text-sm mb-1 group-hover:text-pink-600 transition-colors">${p.titulo}</h3>
            <p class="text-xs text-slate-500 line-clamp-2 mb-4 flex-grow">${p.descricao}</p>
            
            <button class="w-full bg-slate-100 hover:bg-pink-500 hover:text-white text-slate-700 text-xs font-medium py-2 rounded-xl transition-all flex items-center justify-center gap-2">
              <i class="fa-solid fa-expand"></i> Ver Fotos Grandes
            </button>
          </div>
        </div>
      `).join('');
    }

    function filtrarPorCategoria(cat) {
      categoriaAtual = cat;
      renderizarCategorias();
      renderizarProdutos();
    }

    function filtrarProdutos() {
      renderizarProdutos();
    }

    // LÓGICA DA GALERIA EM TELA CHEIA (FLUIDA)
    function abrirGaleria(id, fotoIndex = 0) {
      produtoAtivo = produtos.find(p => p.id === id);
      if (!produtoAtivo) return;

      indiceFotoAtual = fotoIndex;
      atualizarExibicaoGaleria();
      document.getElementById('galeria-modal').classList.remove('hidden');
    }

    function fecharGaleria() {
      document.getElementById('galeria-modal').classList.add('hidden');
    }

    function mudarFotoGaleria(direcao) {
      if (!produtoAtivo) return;
      const total = produtoAtivo.imagens.length;
      indiceFotoAtual = (indiceFotoAtual + direcao + total) % total;
      atualizarExibicaoGaleria();
    }

    function selecionarFotoDireta(index) {
      indiceFotoAtual = index;
      atualizarExibicaoGaleria();
    }

    function atualizarExibicaoGaleria() {
      if (!produtoAtivo) return;

      const total = produtoAtivo.imagens.length;
      document.getElementById('galeria-titulo').innerText = produtoAtivo.titulo;
      document.getElementById('galeria-contador').innerText = `Foto ${indiceFotoAtual + 1} de ${total}`;
      document.getElementById('galeria-descricao').innerText = produtoAtivo.descricao;
      document.getElementById('galeria-imagem').src = produtoAtivo.imagens[indiceFotoAtual];

      // Atualizar link do WhatsApp da galeria
      const msgWa = encodeURIComponent(`Olá! Vi a foto ${indiceFotoAtual + 1} do modelo "${produtoAtivo.titulo}" no catálogo e gostaria de encomendar.`);
      document.getElementById('galeria-btn-whatsapp').href = `https://wa.me/${NUMERO_WHATSAPP}?text=${msgWa}`;

      // Exibir ou ocultar setas laterais
      const btnAnt = document.getElementById('btn-galeria-ant');
      const btnProx = document.getElementById('btn-galeria-prox');
      const miniaturasContainer = document.getElementById('galeria-miniaturas');

      if (total > 1) {
        btnAnt.classList.remove('hidden');
        btnProx.classList.remove('hidden');
        miniaturasContainer.classList.remove('hidden');

        // Renderizar miniaturas no rodapé do zoom
        miniaturasContainer.innerHTML = produtoAtivo.imagens.map((imgUrl, i) => `
          <button 
            onclick="event.stopPropagation(); selecionarFotoDireta(${i})" 
            class="w-12 h-12 rounded-lg overflow-hidden border-2 transition-all flex-shrink-0 ${i === indiceFotoAtual ? 'border-pink-500 scale-105 opacity-100' : 'border-transparent opacity-50 hover:opacity-100'}"
          >
            <img src="${imgUrl}" class="w-full h-full object-cover" />
          </button>
        `).join('');
      } else {
        btnAnt.classList.add('hidden');
        btnProx.classList.add('hidden');
        miniaturasContainer.classList.add('hidden');
      }
    }

    // ATALHOS DE TECLADO E GESTOS NO CELULAR (SWIPE)
    function configurarTeclasETouch() {
      document.addEventListener('keydown', (e) => {
        const galeriaAberta = !document.getElementById('galeria-modal').classList.contains('hidden');
        if (!galeriaAberta) return;

        if (e.key === 'ArrowLeft') mudarFotoGaleria(-1);
        if (e.key === 'ArrowRight') mudarFotoGaleria(1);
        if (e.key === 'Escape') fecharGaleria();
      });

      const modal = document.getElementById('galeria-modal');
      modal.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      modal.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        tratarSwipe();
      }, { passive: true });
    }

    function tratarSwipe() {
      const diferenca = touchEndX - touchStartX;
      if (Math.abs(diferenca) > 40) {
        if (diferenca < 0) {
          mudarFotoGaleria(1); // Deslizou para a esquerda -> próxima foto
        } else {
          mudarFotoGaleria(-1); // Deslizou para a direita -> foto anterior
        }
      }
    }
  </script>
</body>
</html>

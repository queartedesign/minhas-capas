<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Capas Exclusivas</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Font Awesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col relative pb-20">

  <!-- Cabeçalho Principal -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-pink-500 text-white flex items-center justify-center font-bold text-xl shadow-md">
          <i class="fa-solid fa-book-open"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-900 tracking-tight">Catálogo de Capas</h1>
          <p class="text-xs text-slate-500">Agendas & Cadernos Personalizados</p>
        </div>
      </div>
      
      <!-- Busca rápida -->
      <div class="relative w-full sm:w-72">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-sm"></i>
        <input 
          type="text" 
          id="busca-input" 
          placeholder="Buscar modelo ou frase..." 
          class="w-full pl-9 pr-4 py-2 bg-slate-100 rounded-full text-sm border-none focus:ring-2 focus:ring-pink-500 outline-none transition-all"
          oninput="filtrarProdutos()"
        />
      </div>
    </div>

    <!-- Navegação por Categorias -->
    <div class="border-t border-slate-100 bg-white">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <nav class="flex space-x-2 py-3 overflow-x-auto hide-scrollbar text-sm" id="categorias-container">
          <!-- Gerado via JavaScript -->
        </nav>
      </div>
    </div>
  </header>

  <!-- Grade de Capas (Catálogo) -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
    <div id="produtos-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Cards renderizados dinamicamente -->
    </div>
    
    <!-- Mensagem de busca sem resultado -->
    <div id="sem-resultados" class="hidden text-center py-16">
      <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
      <p class="text-slate-500 text-base">Nenhum modelo encontrado para esta busca.</p>
    </div>
  </main>

  <!-- Modal de Detalhes do Produto -->
  <div id="produto-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl relative">
      <button onclick="fecharModal()" class="absolute top-4 right-4 z-10 w-9 h-9 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-full flex items-center justify-center transition-colors">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="p-6">
        <!-- Visualizador Principal de Imagem (Clicável para abrir Tela Cheia) -->
        <div class="relative bg-slate-100 rounded-xl overflow-hidden mb-4 aspect-square max-h-96 flex items-center justify-center cursor-pointer group" onclick="abrirZoom(indiceFotoAtual)">
          <img id="modal-imagem-principal" src="" alt="" class="object-contain max-h-full max-w-full group-hover:scale-105 transition-transform duration-300" />
          
          <!-- Botões de navegação no modal de detalhes -->
          <button id="btn-foto-anterior" onclick="event.stopPropagation(); mudarFoto(-1)" class="absolute left-2 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white text-slate-800 w-8 h-8 rounded-full flex items-center justify-center shadow transition-all">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <button id="btn-foto-proxima" onclick="event.stopPropagation(); mudarFoto(1)" class="absolute right-2 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white text-slate-800 w-8 h-8 rounded-full flex items-center justify-center shadow transition-all">
            <i class="fa-solid fa-chevron-right"></i>
          </button>

          <!-- Dica visual ao passar o mouse ou tocar -->
          <span class="absolute bottom-3 right-3 bg-slate-900/70 text-white text-[11px] px-3 py-1 rounded-lg flex items-center gap-1.5 backdrop-blur-sm shadow pointer-events-none">
            <i class="fa-solid fa-expand"></i> Toque para ampliar
          </span>
        </div>

        <!-- Miniaturas clicáveis -->
        <div id="modal-miniaturas" class="flex gap-2 overflow-x-auto pb-2 mb-4 hide-scrollbar">
          <!-- Renderizado dinamicamente -->
        </div>

        <h3 id="modal-titulo" class="text-xl font-bold text-slate-900 mb-2"></h3>
        <p id="modal-descricao" class="text-slate-600 text-sm mb-6 leading-relaxed"></p>

        <!-- Botão de Pedido via WhatsApp -->
        <a id="modal-btn-whatsapp" href="#" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition-all shadow-md">
          <i class="fa-brands fa-whatsapp text-xl"></i>
          Pedir este Modelo no WhatsApp
        </a>
      </div>
    </div>
  </div>

  <!-- Modal de Zoom em Tela Cheia com Navegação Fluida entre Fotos -->
  <div id="zoom-modal" class="fixed inset-0 bg-black/95 z-50 flex flex-col items-center justify-center hidden select-none" onclick="fecharZoom()">
    
    <!-- Botão Fechar -->
    <button onclick="fecharZoom()" class="absolute top-4 right-4 bg-white/10 hover:bg-white/20 text-white w-10 h-10 rounded-full flex items-center justify-center transition-all z-20">
      <i class="fa-solid fa-xmark text-lg"></i>
    </button>

    <!-- Indicador de Contador (Ex: 1 / 3) -->
    <div id="zoom-contador" class="absolute top-5 left-6 text-white/80 text-sm font-medium bg-white/10 px-3 py-1 rounded-full backdrop-blur-md z-20">
      1 / 1
    </div>

    <!-- Área da Imagem Ampliada com Controle de Gestos -->
    <div class="relative w-full h-full flex items-center justify-center p-2 sm:p-8" onclick="event.stopPropagation()">
      <img id="zoom-imagem" src="" class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl transition-all duration-200" alt="Imagem ampliada" />

      <!-- Seta Esquerda (Anterior) -->
      <button id="zoom-btn-ant" onclick="mudarFotoZoom(-1)" class="absolute left-3 sm:left-6 top-1/2 -translate-y-1/2 bg-white/15 hover:bg-white/30 text-white w-12 h-12 rounded-full flex items-center justify-center transition-all backdrop-blur-md z-20">
        <i class="fa-solid fa-chevron-left text-xl"></i>
      </button>

      <!-- Seta Direita (Próxima) -->
      <button id="zoom-btn-prox" onclick="mudarFotoZoom(1)" class="absolute right-3 sm:right-6 top-1/2 -translate-y-1/2 bg-white/15 hover:bg-white/30 text-white w-12 h-12 rounded-full flex items-center justify-center transition-all backdrop-blur-md z-20">
        <i class="fa-solid fa-chevron-right text-xl"></i>
      </button>
    </div>

    <!-- Legenda/Instrução no Rodapé -->
    <div class="absolute bottom-4 text-white/50 text-xs text-center px-4 z-20">
      Deslize para os lados ou use as setas para ver mais fotos
    </div>
  </div>

  <!-- Botão Flutuante do WhatsApp -->
  <a 
    href="https://wa.me/5598988000000?text=Olá!%20Gostaria%20de%20saber%20mais%20sobre%20as%20capas%20do%20catálogo." 
    target="_blank" 
    id="btn-whatsapp-flutuante"
    class="fixed bottom-6 right-6 z-30 bg-emerald-500 hover:bg-emerald-600 text-white rounded-full p-4 shadow-xl flex items-center justify-center transition-all hover:scale-105 group"
    title="Fale Conosco no WhatsApp"
  >
    <i class="fa-brands fa-whatsapp text-2xl"></i>
    <span class="max-w-0 overflow-hidden whitespace-nowrap group-hover:max-w-xs transition-all duration-300 ease-in-out text-sm font-medium pl-0 group-hover:pl-2">
      Falar no WhatsApp
    </span>
  </a>

  <!-- Rodapé -->
  <footer class="bg-white border-t border-slate-200 mt-auto py-6 text-center text-xs text-slate-500">
    <p>© Catálogo de Capas Personalizadas. Todos os direitos reservados.</p>
  </footer>

  <!-- Lógica da Aplicação -->
  <script>
    const NUMERO_WHATSAPP = "5598988000000"; // Substitua pelo seu WhatsApp real

    const produtos = [
      {
        id: 1,
        titulo: "Capa Corrida Transforma - Rosa",
        categoria: "agendas",
        imagens: [
          "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=800&auto=format&fit=crop",
          "https://images.unsplash.com/photo-1512820790803-83ca734da794?w=800&auto=format&fit=crop"
        ],
        descricao: "Design exclusivo em tons rosa e branco com laminação durável e acabamento impecável."
      },
      {
        id: 2,
        titulo: "Caderno Personalizado Floral",
        categoria: "cadernos",
        imagens: [
          "https://images.unsplash.com/photo-1531346878377-a5be20888e57?w=800&auto=format&fit=crop"
        ],
        descricao: "Estampa floral elegante com acabamento fosco aveludado e espaço para detalhes."
      },
      {
        id: 3,
        titulo: "Capa Minimalista Executiva",
        categoria: "agendas",
        imagens: [
          "https://images.unsplash.com/photo-1589829085413-56de8ae18c73?w=800&auto=format&fit=crop"
        ],
        descricao: "Visual limpo e sofisticado para planejamento diário e rotina de trabalho."
      }
    ];

    let categoriaAtual = 'todas';
    let produtoAtivo = null;
    let indiceFotoAtual = 0;

    // Suporte para swipe no celular
    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener('DOMContentLoaded', () => {
      renderizarCategorias();
      renderizarProdutos();
      atualizarLinkWhatsappFlutuante();
      configurarTeclasEToques();
    });

    function atualizarLinkWhatsappFlutuante() {
      const btn = document.getElementById('btn-whatsapp-flutuante');
      btn.href = `https://wa.me/${NUMERO_WHATSAPP}?text=Olá!%20Gostaria%20de%20tirar%20uma%20dúvida%20sobre%20as%20capas.`;
    }

    function renderizarCategorias() {
      const container = document.getElementById('categorias-container');
      const categorias = [
        { id: 'todas', nome: 'Todas as Capas' },
        { id: 'agendas', nome: 'Agendas' },
        { id: 'cadernos', nome: 'Cadernos' }
      ];

      container.innerHTML = categorias.map(cat => `
        <button 
          onclick="filtrarPorCategoria('${cat.id}')"
          class="px-4 py-1.5 rounded-full whitespace-nowrap transition-all text-xs font-medium ${
            categoriaAtual === cat.id 
              ? 'bg-pink-500 text-white shadow-sm' 
              : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
          }"
        >
          ${cat.nome}
        </button>
      `).join('');
    }

    function renderizarProdutos() {
      const grid = document.getElementById('produtos-grid');
      const semResultados = document.getElementById('sem-resultados');
      const termoBusca = document.getElementById('busca-input').value.toLowerCase();

      const filtrados = produtos.filter(p => {
        const bateCategoria = categoriaAtual === 'todas' || p.categoria === categoriaAtual;
        const bateBusca = p.titulo.toLowerCase().includes(termoBusca) || p.descricao.toLowerCase().includes(termoBusca);
        return bateCategoria && bateBusca;
      });

      if (filtrados.length === 0) {
        grid.innerHTML = '';
        semResultados.classList.remove('hidden');
        return;
      }

      semResultados.classList.add('hidden');
      grid.innerHTML = filtrados.map(p => `
        <div class="bg-white rounded-2xl border border-slate-200/80 overflow-hidden shadow-sm hover:shadow-md transition-all flex flex-col group">
          <div class="relative aspect-square bg-slate-100 overflow-hidden cursor-pointer" onclick="abrirModal(${p.id})">
            <img src="${p.imagens[0]}" alt="${p.titulo}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy" />
            ${p.imagens.length > 1 ? `
              <span class="absolute top-3 right-3 bg-slate-900/70 backdrop-blur-sm text-white text-[10px] px-2 py-0.5 rounded-full flex items-center gap-1">
                <i class="fa-solid fa-images"></i> ${p.imagens.length}
              </span>
            ` : ''}
          </div>
          <div class="p-4 flex flex-col flex-grow">
            <h3 class="font-semibold text-slate-900 text-sm mb-1 group-hover:text-pink-600 transition-colors">${p.titulo}</h3>
            <p class="text-xs text-slate-500 line-clamp-2 mb-4 flex-grow">${p.descricao}</p>
            
            <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
              <button onclick="abrirModal(${p.id})" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium py-2 rounded-xl transition-colors">
                Ver Fotos
              </button>
              <a href="https://wa.me/${NUMERO_WHATSAPP}?text=Olá!%20Gostaria%20de%20encomendar%20a%20capa:%20${encodeURIComponent(p.titulo)}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium px-3 py-2 rounded-xl transition-colors flex items-center justify-center gap-1">
                <i class="fa-brands fa-whatsapp text-sm"></i>
              </a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filtrarPorCategoria(cat) {
      categoriaAtual = cat;
      renderizarCategorias();
      renderizarProdutos();
    }

    function filtrarProdutos() {
      renderizarProdutos();
    }

    // MODAL DE DETALHES
    function abrirModal(id) {
      produtoAtivo = produtos.find(p => p.id === id);
      if (!produtoAtivo) return;

      indiceFotoAtual = 0;
      document.getElementById('modal-titulo').innerText = produtoAtivo.titulo;
      document.getElementById('modal-descricao').innerText = produtoAtivo.descricao;
      
      const mensagemWa = encodeURIComponent(`Olá! Vi a capa "${produtoAtivo.titulo}" no catálogo e gostaria de encomendar.`);
      document.getElementById('modal-btn-whatsapp').href = `https://wa.me/${NUMERO_WHATSAPP}?text=${mensagemWa}`;

      atualizarExibicaoFotoModal();
      document.getElementById('produto-modal').classList.remove('hidden');
    }

    function fecharModal() {
      document.getElementById('produto-modal').classList.add('hidden');
    }

    function mudarFoto(direcao) {
      if (!produtoAtivo) return;
      const total = produtoAtivo.imagens.length;
      indiceFotoAtual = (indiceFotoAtual + direcao + total) % total;
      atualizarExibicaoFotoModal();
    }

    function selecionarFotoIndex(index) {
      indiceFotoAtual = index;
      atualizarExibicaoFotoModal();
    }

    function atualizarExibicaoFotoModal() {
      if (!produtoAtivo) return;

      const imgPrincipal = document.getElementById('modal-imagem-principal');
      imgPrincipal.src = produtoAtivo.imagens[indiceFotoAtual];

      const btnAnt = document.getElementById('btn-foto-anterior');
      const btnProx = document.getElementById('btn-foto-proxima');
      const miniaturasContainer = document.getElementById('modal-miniaturas');

      if (produtoAtivo.imagens.length > 1) {
        btnAnt.classList.remove('hidden');
        btnProx.classList.remove('hidden');
        miniaturasContainer.classList.remove('hidden');

        miniaturasContainer.innerHTML = produtoAtivo.imagens.map((imgUrl, i) => `
          <button onclick="selecionarFotoIndex(${i})" class="w-14 h-14 rounded-lg overflow-hidden border-2 transition-all flex-shrink-0 ${i === indiceFotoAtual ? 'border-pink-500 opacity-100 scale-95' : 'border-transparent opacity-60 hover:opacity-100'}">
            <img src="${imgUrl}" class="w-full h-full object-cover" />
          </button>
        `).join('');
      } else {
        btnAnt.classList.add('hidden');
        btnProx.classList.add('hidden');
        miniaturasContainer.classList.add('hidden');
      }
    }

    // MODO TELA CHEIA (ZOOM FLUIDO COM NAVEGAÇÃO COMPLETA)
    function abrirZoom(index = 0) {
      if (!produtoAtivo) return;
      
      indiceFotoAtual = index;
      document.getElementById('produto-modal').classList.add('hidden');
      
      atualizarExibicaoZoom();
      document.getElementById('zoom-modal').classList.remove('hidden');
    }

    function fecharZoom() {
      document.getElementById('zoom-modal').classList.add('hidden');
      if (produtoAtivo) {
        document.getElementById('produto-modal').classList.remove('hidden');
      }
    }

    function mudarFotoZoom(direcao) {
      if (!produtoAtivo) return;
      const total = produtoAtivo.imagens.length;
      indiceFotoAtual = (indiceFotoAtual + direcao + total) % total;
      atualizarExibicaoZoom();
      atualizarExibicaoFotoModal();
    }

    function atualizarExibicaoZoom() {
      if (!produtoAtivo) return;

      const total = produtoAtivo.imagens.length;
      const zoomImg = document.getElementById('zoom-imagem');
      const contador = document.getElementById('zoom-contador');
      const btnAnt = document.getElementById('zoom-btn-ant');
      const btnProx = document.getElementById('zoom-btn-prox');

      zoomImg.src = produtoAtivo.imagens[indiceFotoAtual];
      contador.innerText = `${indiceFotoAtual + 1} / ${total}`;

      if (total > 1) {
        btnAnt.classList.remove('hidden');
        btnProx.classList.remove('hidden');
      } else {
        btnAnt.classList.add('hidden');
        btnProx.classList.add('hidden');
      }
    }

    // TECLAS E GESTOS TOUCH (SWIPE)
    function configurarTeclasEToques() {
      // Teclas ← e → do teclado
      document.addEventListener('keydown', (e) => {
        const zoomAberto = !document.getElementById('zoom-modal').classList.contains('hidden');
        if (!zoomAberto) return;

        if (e.key === 'ArrowLeft') mudarFotoZoom(-1);
        if (e.key === 'ArrowRight') mudarFotoZoom(1);
        if (e.key === 'Escape') fecharZoom();
      });

      // Gestos de deslizar o dedo (Swipe) no celular no modo zoom
      const zoomModal = document.getElementById('zoom-modal');
      
      zoomModal.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      zoomModal.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        tratarSwipe();
      }, { passive: true });
    }

    function tratarSwipe() {
      const diferenca = touchEndX - touchStartX;
      // Sensibilidade do deslize (mínimo de 40px)
      if (Math.abs(diferenca) > 40) {
        if (diferenca < 0) {
          mudarFotoZoom(1); // Deslizou para esquerda = Próxima foto
        } else {
          mudarFotoZoom(-1); // Deslizou para direita = Foto anterior
        }
      }
    }
  </script>
</body>
</html>
